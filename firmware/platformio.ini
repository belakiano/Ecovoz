; Firmware do sensor EcoVoz. NÃO foi compilado no ambiente de desenvolvimento do pacote (sem a cadeia ESP32).
; Compile no seu computador com PlatformIO: pio run -e sensor
; As versões das bibliotecas abaixo precisam ser confirmadas na primeira compilação.
[env:sensor]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -I ../nucleo
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    jgromes/RadioLib@^7.1.0
    tanakamasayuki/TensorFlowLite_ESP32
